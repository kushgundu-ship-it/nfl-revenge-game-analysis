<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 490" role="img" aria-labelledby="title desc">
  <title id="title">NFL revenge-game analysis data flow</title>
  <desc id="desc">Raw nflverse data flows through cleaned games, former-team history, rolling features, comparison groups, inference, and a read-only Streamlit dashboard. Usage and sensitivity summaries also feed the dashboard.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718896"/></marker></defs>
  <rect width="940" height="490" rx="14" fill="#F0EEE7"/>
  <g fill="none" stroke="#718896" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 285 92 H 333"/><path d="M 600 92 H 648"/>
    <path d="M 780 145 V 198"/><path d="M 650 250 H 604"/><path d="M 335 250 H 289"/>
    <path d="M 150 303 V 397 H 333"/><path d="M 780 303 V 350"/><path d="M 650 397 H 604"/>
  </g>
  <g font-family="Arial, sans-serif">
    <g fill="#FFFFFF" stroke="#D9DDD4">
      <rect x="20" y="40" width="265" height="105" rx="8"/>
      <rect x="335" y="40" width="265" height="105" rx="8"/>
      <rect x="650" y="40" width="270" height="105" rx="8"/>
      <rect x="650" y="200" width="270" height="103" rx="8"/>
      <rect x="335" y="200" width="265" height="103" rx="8"/>
      <rect x="20" y="200" width="265" height="103" rx="8"/>
      <rect x="650" y="352" width="270" height="90" rx="8"/>
      <rect x="335" y="352" width="265" height="90" rx="8" fill="#E2EEE7" stroke="#14796B"/>
    </g>
    <g fill="#14796B" font-size="11" font-weight="bold" letter-spacing="1.2">
      <text x="37" y="64">SOURCE SNAPSHOT</text><text x="352" y="64">STAGE 1 / SQL</text><text x="667" y="64">STAGE 2 / SQL</text>
      <text x="667" y="224">STAGE 3 / SQL</text><text x="352" y="224">STAGES 3–4 / SQL</text><text x="37" y="224">STAGE 4 / PYTHON</text>
      <text x="667" y="376">STAGE 4 / SQL</text><text x="352" y="376">STAGE 5 / STREAMLIT</text>
    </g>
    <g fill="#182C36" font-size="18" font-weight="bold">
      <text x="37" y="91">Raw stats + schedules</text><text x="352" y="91">Clean player games</text><text x="667" y="91">Former-team history</text>
      <text x="667" y="251">Rolling features</text><text x="352" y="251">Same-player comparisons</text><text x="37" y="251">Clustered inference</text>
      <text x="667" y="402">Usage + sensitivity</text><text x="352" y="402">Read-only dashboard</text>
    </g>
    <g fill="#526670" font-size="13">
      <text x="37" y="115">nflverse Parquet + schedule CSV</text><text x="37" y="133">Preserved files and raw tables</text>
      <text x="352" y="115">player_id + game_id</text><text x="352" y="133">Regular season · QB / RB / WR / TE</text>
      <text x="667" y="115">Strictly earlier appearances</text><text x="667" y="133">Four-game tenure + reunion flags</text>
      <text x="667" y="276">Previous eight; minimum four</text><text x="667" y="293">Residuals + baseline contributors</text>
      <text x="352" y="276">Revenge + non-revenge groups</text><text x="352" y="293">One within-player contrast per ID</text>
      <text x="37" y="276">Player bootstrap + sign-flip test</text><text x="37" y="293">Saved Stage 4 CSVs and validation</text>
      <text x="667" y="426">Existing views + saved summaries</text><text x="352" y="426">Evidence · patterns · player audit</text>
      <text x="20" y="472">A presentation layer over validated data. No dashboard recalculation of analytical definitions.</text>
    </g>
  </g>
</svg>
